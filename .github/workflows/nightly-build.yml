name: Nightly rebuild and deploy

on:
  schedule:
    # 02:15 UTC ≈ after Stockholm exchange close and Yahoo's end-of-day data settles
    - cron: '15 2 * * *'
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify native module loads
        run: node -e "require('better-sqlite3'); console.log('better-sqlite3 OK')" || (npm rebuild better-sqlite3 --build-from-source && node -e "require('better-sqlite3'); console.log('better-sqlite3 OK after rebuild')")

      - name: Fetch prices/fundamentals, run LLM analysis, render site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/data.json build/history.sqlite build/analyses.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "Nightly data refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Add custom domain to Pages artifact
        run: |
          if [ -f CNAME ]; then cp CNAME build/site/CNAME; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
